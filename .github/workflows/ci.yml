name: CI — Pipeline & Topology Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-pipeline:
    name: Python {{ matrix.python-version }} — Syntax & Architectural Pipeline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python modules (syntax & import check)
        run: |
          python -m py_compile app.py cad_processor/*.py tests/*.py

      - name: Run automated wall connectivity, multi-format pipeline & topology suite
        run: |
          python -m unittest discover -s tests -v
