name: CI — Pipeline & Topology Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-pipeline:
    name: Python ${{ matrix.python-version }} — Syntax & Architectural Pipeline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install official headless Blender 5.1 (for 3D FBX slicing & .blend/.fbx export on Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libgl1 libegl1
          curl -fsSL https://download.blender.org/release/Blender5.1/blender-5.1.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          sudo tar -xJf /tmp/blender.tar.xz -C /opt
          sudo ln -sf /opt/blender-5.1.0-linux-x64/blender /usr/local/bin/blender
          rm -f /tmp/blender.tar.xz
          blender --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python modules (syntax & import check)
        run: |
          python -m py_compile app.py cad_processor/*.py tests/*.py

      - name: Run automated wall connectivity, multi-format pipeline & topology suite
        run: |
          python -m unittest discover -s tests -v
